name: 🚀 Deploy WildTrip

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v3
      
      - name: 🐍 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 安装依赖
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: 🧪 运行测试
        run: |
          echo "✅ 测试通过（暂未实现完整测试）"
      
      - name: 🚀 部署到服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🔄 开始部署野游记..."
            
            # 进入项目目录
            cd /root/clawd/wildtrip
            
            # 拉取最新代码
            git pull origin main
            
            # 重启服务
            screen -S wildtrip-backend -X quit || true
            screen -dmS wildtrip-backend bash -c "cd backend && python3 app.py"
            
            sleep 2
            
            # 检查服务状态
            if curl -s http://localhost:5000/api/task/test | grep -q "TASK_NOT_FOUND"; then
              echo "✅ 服务启动成功！"
            else
              echo "❌ 服务启动失败！"
              exit 1
            fi
            
            echo "🎉 部署完成！"
      
      - name: 📢 部署通知
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ 部署成功！"
          else
            echo "❌ 部署失败！"
          fi
