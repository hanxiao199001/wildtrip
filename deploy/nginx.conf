server {
    listen 8080;
    server_name _;
    
    # 根目录
    root /root/clawd/wildtrip/web;
    
    # 字符集
    charset utf-8;
    
    # 首页
    location / {
        index index.html;
    }
    
    # 攻略静态页面（支持中文）
    location /guides/ {
        try_files $uri $uri/ =404;
    }
    
    # 日志
    access_log /root/clawd/wildtrip/logs/nginx-access.log;
    error_log /root/clawd/wildtrip/logs/nginx-error.log;
}
