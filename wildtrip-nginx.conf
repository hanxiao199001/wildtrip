# Wildtrip API Server Configuration
# 放在 /etc/nginx/sites-available/wildtrip
# 然后 ln -s 到 sites-enabled

server {
    listen 80;
    server_name api.wildtrip.com.cn;
    
    # 重定向所有 HTTP 请求到 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.wildtrip.com.cn;
    
    # SSL 证书路径（certbot 自动生成后会在这里）
    ssl_certificate /etc/letsencrypt/live/api.wildtrip.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wildtrip.com.cn/privkey.pem;
    
    # SSL 配置（推荐设置）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # 日志
    access_log /var/log/nginx/wildtrip_access.log;
    error_log /var/log/nginx/wildtrip_error.log;
    
    # API 代理到 Flask 后端
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        
        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # CORS 头（如果 Flask 没配的话）
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        
        # OPTIONS 请求直接返回 204
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # 健康检查
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # 静态文件（如果需要的话）
    location / {
        root /var/www/wildtrip;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
